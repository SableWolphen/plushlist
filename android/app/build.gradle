apply plugin: 'com.android.application'

android {
    namespace "com.PlushLife"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.PlushLife"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // The web content this app's WebView loads comes live from GitHub
        // Pages, independent of which native build is installed — so it
        // can't tell you which native build (with which native fixes) is
        // actually on the device. android-release.yml sets this env var to
        // the exact commit the CI build ran from; BuildInfoPlugin exposes it
        // to the web content for an About screen. Falls back to "unknown"
        // for a local `./gradlew assembleDebug` where it's never set.
        buildConfigField "String", "GIT_SHA", "\"${System.getenv('PLUSHLIFE_GIT_SHA') ?: 'unknown'}\""
    }
    buildFeatures {
        buildConfig true
    }
    // Release signing comes entirely from environment variables (set as GitHub
    // Actions secrets in .github/workflows/android-release.yml) so the keystore,
    // its password, and the key alias/password never appear in this repo. A
    // local `./gradlew assembleDebug` for day-to-day development doesn't need
    // any of this — only `bundleRelease`/`assembleRelease` read it, and only
    // once those four env vars are actually set.
    def hasReleaseSigning = System.getenv('PLUSHLIFE_KEYSTORE_PATH') != null
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(System.getenv('PLUSHLIFE_KEYSTORE_PATH'))
                storePassword System.getenv('PLUSHLIFE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PLUSHLIFE_KEY_ALIAS')
                keyPassword System.getenv('PLUSHLIFE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Resource shrinking was temporarily disabled as a diagnostic
            // while "Couldn't add widget" was under investigation — it
            // stayed off even after that diagnostic build confirmed
            // shrinking wasn't the cause (the real fix was a missing
            // previewLayout on the widget's provider XML, unrelated to
            // shrinking). Back on for the smaller release size; keep.xml
            // still protects the widget's resources as defense in depth.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    // androidx.activity (added for edge-to-edge support) pulls in androidx.datastore's
    // native shared-counter library transitively. This app never uses Jetpack DataStore
    // directly, and the library's sudden first-time presence made Play Console report
    // 0 supported devices for the release. Excluding it restores the previous (working)
    // zero-native-library state without touching the edge-to-edge fix itself.
    packagingOptions {
        exclude 'lib/*/libdatastore_shared_counter.so'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Crashlytics reports real native crashes (with stack traces) to the
    // Firebase console within minutes, unlike Play Console's own crash
    // dashboard, which needs a lot more install/session volume before it
    // shows anything at all — exactly the gap that made the push-
    // notification crash impossible to diagnose from Play Console alone.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    // Lets MainActivity ask Play Store directly whether a newer version is
    // live and, if so, force that update on launch — instead of waiting on
    // the device's own background auto-update job, which is what silently
    // left devices on a stale build after past releases.
    implementation "com.google.android.play:app-update:$playAppUpdateVersion"
    // Tiny (~30KB), free, MIT-licensed embedded HTTP server used only to
    // accept loopback (127.0.0.1) requests from the Zepp/Amazfit watch app's
    // side-service — see android/app/src/main/java/com/PlushLife/watchsync/.
    implementation "org.nanohttpd:nanohttpd:2.3.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services/crashlytics plugins not applied. Push Notifications won't work")
}
