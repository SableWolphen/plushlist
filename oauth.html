<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connect PlushLife</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#fff6fb;color:#3e2132;margin:0;padding:2rem}
    main{max-width:430px;margin:8vh auto;padding:2rem;background:white;border-radius:18px;box-shadow:0 12px 40px #c98ba633}
    h1{margin-top:0}label{display:block;margin-top:1rem;font-weight:600}input{width:100%;box-sizing:border-box;padding:.75rem;margin-top:.35rem;border:1px solid #d7abc3;border-radius:9px}button{width:100%;margin-top:1.35rem;padding:.8rem;border:0;border-radius:9px;background:#b43a76;color:white;font-weight:700}#status{min-height:1.4rem;color:#9b2458}
  </style>
</head>
<body>
  <main>
    <h1>Connect your tracker</h1>
    <p>Sign in with the same email and password you use in PlushLife. ChatGPT will receive read-only access to your daily checklist.</p>
    <form id="form">
      <label>Email<input required type="email" name="email" autocomplete="email"></label>
      <label>Password<input required type="password" name="password" autocomplete="current-password"></label>
      <button type="submit">Connect securely</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script>
    const requestToken = new URLSearchParams(location.search).get('request');
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    if (!requestToken) { form.hidden = true; status.textContent = 'This connection request is missing or expired. Please return to ChatGPT and try again.'; }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Connecting…';
      const data = new FormData(form); data.set('request', requestToken);
      try {
        const response = await fetch('https://pvitdhixycegmcovapyh.supabase.co/functions/v1/glow-progress-mcp/authorize', { method: 'POST', body: data });
        if (!response.ok) throw new Error(await response.text());
        const result = await response.json();
        location.assign(result.redirect_to);
      } catch (error) { status.textContent = error.message || 'Connection failed. Please try again.'; }
    });
  </script>
</body>
</html>
