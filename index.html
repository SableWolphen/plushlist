<!-- Two SRI hashes (either may match): the bytes vendored to ./vendor/ by
     the web build and the pinned jsDelivr bytes served to this root copy.
     Both are @supabase/supabase-js 2.111.0 (aligned with package-lock). -->

<!-- Native bridge: the Capacitor back-button, splash, push-channel, and
     on-device notification scheduler code that used to live in an inline
     <script> here now lives in src/native-bridge.js, imported at the top of
     src/app-source.jsx so esbuild bundles it ahead of the app code. -->
<script src="./assets/app.bundle.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });

    navigator.serviceWorker.register("./service-worker.js").then((registration) => {
      const activateWaitingWorker = () => {
        const waiting = registration.waiting;
        if (waiting) waiting.postMessage({ type: "SKIP_WAITING" });
      };

      if (registration.waiting) activateWaitingWorker();
      registration.addEventListener("updatefound", () => {
        const incoming = registration.installing;
        if (!incoming) return;
        incoming.addEventListener("statechange", () => {
          if (incoming.state === "installed" && navigator.serviceWorker.controller) {
            activateWaitingWorker();
          }
        });
      });

      // Keep long-lived installs current without making users hunt for refresh.
      const UPDATE_CHECK_MS = 15 * 60 * 1000;
      let lastUpdateCheck = 0;
      const checkForUpdate = () => {
        const now = Date.now();
        if (now - lastUpdateCheck < UPDATE_CHECK_MS) return;
        lastUpdateCheck = now;
        registration.update().then(activateWaitingWorker).catch(() => {});
      };
      window.setInterval(checkForUpdate, UPDATE_CHECK_MS);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") checkForUpdate();
      });
    }).catch(() => {});
  });
}
</script>
