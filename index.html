<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b75acb">
<!-- This app has no native dark theme (only its own in-app Dark Mode
     toggle), but without this the WebView's own automatic "dark theme
     for web content" feature can still decide to darken elements on its
     own when the OS is in system dark mode — inverting a light header
     background to near-black while leaving its text light, which is
     what showed up as a persistent black title bar that no native
     Android theme/ActionBar change ever touched, because it was never
     native chrome to begin with. Declaring the page as light-only opts
     it out of that automatic darkening. -->
<meta name="color-scheme" content="light only">
<meta name="description" content="PlushLife is a gentle, private care and routine companion that adapts to the day you are actually having.">
<meta property="og:title" content="PlushLife — Care that fits today.">
<meta property="og:description" content="Adaptive routines, private progress, grounding tools, guided paths, sleep support, and optional Guardian care.">
<meta property="og:type" content="website">
<meta property="og:image" content="./social-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PlushLife — Care that fits today.">
<meta name="twitter:description" content="Adaptive routines, private progress, grounding tools, guided paths, sleep support, and optional Guardian care.">
<meta name="twitter:image" content="./social-preview.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>PlushLife</title>
<style>
  /* Edge-to-edge (Android) extends the WebView under the status bar, and
     without an explicit background here that strip falls back to the
     WebView's own default canvas color instead of the app's actual color —
     this is what showed up as a black bar at the top on native builds. */
  html, body { background-color: #FFF6FB; color-scheme: light only; }
  :focus-visible { outline: 3px solid #4C8FE8 !important; outline-offset: 3px; }
  .skip-link { position: fixed; left: 12px; top: -60px; z-index: 99999; padding: 10px 14px; border-radius: 10px; background: #5B4B6B; color: white; font: 800 14px system-ui, sans-serif; }
  .skip-link:focus { top: 12px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  @media (pointer: coarse) { button, input, select { min-height: 44px; } }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script src="./assets/care-upgrades.js"></script>
<script src="./assets/entitlements.js"></script>
<script src="./assets/plush-content.js"></script>
<script src="./assets/plush-helpers.js"></script>
<script src="./assets/plush-schedule.js"></script>
<script src="./assets/plush-billing.js"></script>
<script>
// Native-shell integration for the Capacitor Android build. window.Capacitor
// only exists inside the packaged native app, so this is a complete no-op on
// the regular web/GitHub Pages version — one script, both deployments.
(function () {
  if (!window.Capacitor || !window.Capacitor.Plugins) return;
  var Plugins = window.Capacitor.Plugins;

  if (Plugins.StatusBar) {
    // setBackgroundColor() used to be called here too, but it routes to
    // Window.setStatusBarColor() — deprecated on Android 15+ (flagged by
    // Play Console's pre-launch report) and fundamentally at odds with
    // EdgeToEdge.enable() in MainActivity, which already draws the app's
    // own content under a transparent status bar. setStyle() alone (icon
    // color only) uses the non-deprecated WindowInsetsControllerCompat API.
    Plugins.StatusBar.setStyle({ style: "DARK" }).catch(function () {});
  }

  if (Plugins.App) {
    var exitArmed = false;
    Plugins.App.addListener("backButton", function (state) {
      // Every full-screen ToolPanel modal (Settings, Guardian, Help, Rewards, task
      // editors, etc.) already closes itself on Escape — reuse that instead of
      // teaching the native shell about each panel's own close handler.
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
      if (state && state.canGoBack) {
        window.history.back();
        return;
      }
      if (exitArmed) {
        Plugins.App.exitApp();
        return;
      }
      exitArmed = true;
      window.setTimeout(function () { exitArmed = false; }, 2000);
    });
  }

  window.addEventListener("load", function () {
    if (Plugins.SplashScreen) Plugins.SplashScreen.hide().catch(function () {});
  });

  // Native push registration (Android FCM). This only fires a real token once
  // a Firebase project + google-services.json are added to the Android build
  // (see docs/android-release.md) — until then, registrationError fires
  // instead, which we swallow quietly since notifications simply aren't wired
  // up yet. The app-source script picks up window.__plushlifeNativePushToken
  // once a user is signed in and upserts it into push_subscriptions.
  if (Plugins.PushNotifications) {
    Plugins.PushNotifications.createChannel({
      id: "plushlife-care",
      name: "PlushLife care reminders",
      description: "Gentle check-ins and Guardian support chosen in PlushLife",
      importance: 3,
      visibility: 1,
      vibration: true,
    }).catch(function () {});
    Plugins.PushNotifications.addListener("registration", function (token) {
      window.__plushlifeNativePushToken = token && token.value;
      document.dispatchEvent(new CustomEvent("plushlife-native-push-token"));
    });
    Plugins.PushNotifications.addListener("registrationError", function () {});
    Plugins.PushNotifications.addListener("pushNotificationActionPerformed", function (event) {
      var target = event && event.notification && event.notification.data && event.notification.data.url;
      if (typeof target === "string" && /^https:\/\/sablewolphen\.github\.io\/plushlist\/?/.test(target)) {
        window.location.href = target;
      }
    });
  }

  // Personal reminders are scheduled on the device, so they keep working
  // without a network connection. Guardian messages still use FCM. Local
  // reminders carry gentle snooze actions instead of forcing an immediate
  // choice when someone has low capacity.
  if (Plugins.LocalNotifications) {
    var LocalNotifications = Plugins.LocalNotifications;
    var reminderChannelId = "plushlife-reminders";
    LocalNotifications.createChannel({
      id: reminderChannelId,
      name: "PlushLife reminders",
      description: "Private routine reminders scheduled on this device",
      importance: 3,
      visibility: 1,
      vibration: true,
    }).catch(function () {});
    LocalNotifications.registerActionTypes({
      types: [{
        id: "PLUSHLIFE_REMINDER",
        actions: [
          { id: "SNOOZE_10", title: "10 min" },
          { id: "SNOOZE_30", title: "30 min" },
          { id: "SNOOZE_60", title: "1 hour" },
        ],
      }],
    }).catch(function () {});

    var scheduleLocalReminder = function (details) {
      var at = details.at instanceof Date ? details.at : new Date(details.at);
      if (!Number.isFinite(at.getTime()) || at.getTime() <= Date.now()) return Promise.resolve();
      return LocalNotifications.schedule({ notifications: [{
        id: details.id,
        title: details.title || "A gentle PlushLife reminder",
        body: details.body || "Open PlushLife when you're ready.",
        schedule: { at: at, allowWhileIdle: true },
        channelId: reminderChannelId,
        actionTypeId: "PLUSHLIFE_REMINDER",
        autoCancel: true,
        extra: details.extra || {},
      }] });
    };

    window.PlushLifeNativeNotifications = {
      syncDailyReminders: async function (options) {
        var pending = await LocalNotifications.getPending();
        var old = (pending.notifications || []).filter(function (item) {
          return item.extra && item.extra.plushlifeKind === "daily-reminder";
        });
        if (old.length) await LocalNotifications.cancel({ notifications: old.map(function (item) { return { id: item.id }; }) });
        if (!options || !options.enabled) return;
        var times = Array.isArray(options.times) ? options.times.slice(0, 8) : [];
        var restDates = new Set(Array.isArray(options.restDates) ? options.restDates : []);
        var notifications = [];
        for (var dayOffset = 0; dayOffset < 7; dayOffset += 1) {
          for (var timeIndex = 0; timeIndex < times.length; timeIndex += 1) {
            var parts = String(times[timeIndex]).split(":").map(Number);
            if (parts.length !== 2 || parts.some(function (part) { return !Number.isFinite(part); })) continue;
            var at = new Date();
            at.setDate(at.getDate() + dayOffset);
            at.setHours(parts[0], parts[1], 0, 0);
            if (at.getTime() <= Date.now()) continue;
            var dateKey = window.PlushLifeCare.localDateString(at);
            if (restDates.has(dateKey)) continue;
            notifications.push({
              id: window.PlushLifeCare.notificationId("daily-" + dateKey + "-" + timeIndex),
              title: "A gentle PlushLife reminder",
              body: options.discreet ? "You have something waiting in PlushLife." : "One caring step is enough. Open your PlushList when you're ready.",
              schedule: { at: at, allowWhileIdle: true },
              channelId: reminderChannelId,
              actionTypeId: "PLUSHLIFE_REMINDER",
              autoCancel: true,
              extra: { plushlifeKind: "daily-reminder", reminderTime: times[timeIndex] },
            });
          }
          (Array.isArray(options.taskReminders) ? options.taskReminders : []).forEach(function (task) {
            if (!task || !task.time) return;
            var date = new Date();
            date.setDate(date.getDate() + dayOffset);
            var dateKey = window.PlushLifeCare.localDateString(date);
            if (restDates.has(dateKey)) return;
            var dayId = window.PlushLifeCare.DAY_IDS[date.getDay()];
            if (Array.isArray(task.scheduleDays) && task.scheduleDays.length && !task.scheduleDays.includes(dayId)) return;
            var taskParts = String(task.time).slice(0, 5).split(":").map(Number);
            if (taskParts.length !== 2 || taskParts.some(function (part) { return !Number.isFinite(part); })) return;
            date.setHours(taskParts[0], taskParts[1], 0, 0);
            if (date.getTime() <= Date.now()) return;
            notifications.push({
              id: window.PlushLifeCare.notificationId("task-" + task.taskKey + "-" + dateKey),
              title: "Ready for one caring step?",
              body: options.discreet ? "You have something waiting in PlushLife." : task.label,
              schedule: { at: date, allowWhileIdle: true },
              channelId: reminderChannelId,
              actionTypeId: "PLUSHLIFE_REMINDER",
              autoCancel: true,
              extra: { plushlifeKind: "daily-reminder", taskKey: task.taskKey, taskLabel: task.label },
            });
          });
        }
        if (notifications.length) await LocalNotifications.schedule({ notifications: notifications });
      },
      snoozeTask: function (options) {
        var minutes = Math.max(1, Math.min(1440, Number(options && options.minutes) || 10));
        var at = new Date(Date.now() + minutes * 60000);
        return scheduleLocalReminder({
          id: window.PlushLifeCare.notificationId((options && options.taskKey) || "task", at.getTime() % 2147483647),
          title: "Ready for one caring step?",
          body: options && options.label ? options.label : "Your PlushLife task is waiting when you're ready.",
          at: at,
          extra: { plushlifeKind: "task-snooze", taskKey: options && options.taskKey, taskLabel: options && options.label },
        });
      },
    };

    LocalNotifications.addListener("localNotificationActionPerformed", function (event) {
      var minutesByAction = { SNOOZE_10: 10, SNOOZE_30: 30, SNOOZE_60: 60 };
      var minutes = minutesByAction[event && event.actionId];
      var notification = event && event.notification;
      if (minutes && notification) {
        scheduleLocalReminder({
          id: window.PlushLifeCare.notificationId("action-snooze", Date.now() % 2147483647),
          title: notification.title,
          body: notification.body,
          at: new Date(Date.now() + minutes * 60000),
          extra: notification.extra || {},
        }).catch(function () {});
        document.dispatchEvent(new CustomEvent("plushlife-notification-snoozed", { detail: { minutes: minutes } }));
      }
    });
  }
})();
</script>
<script src="./assets/app.bundle.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
}
</script>
</body>
</html>
