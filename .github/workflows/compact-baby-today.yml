name: Compact Baby Mode validation
on:
  push:
    branches:
      - compact-baby-today
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: compact-baby-today
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-compact-baby-today.js
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Remove temporary validation files
        run: |
          rm scripts/apply-compact-baby-today.js
          rm .github/workflows/compact-baby-today.yml
      - name: Commit validated Baby Mode polish
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add src/components/baby-today.jsx src/components/baby-mode.jsx scripts/test-product-quality.js scripts/apply-compact-baby-today.js .github/workflows/compact-baby-today.yml
          git commit -m "Shorten Baby Mode Today"
          git push origin compact-baby-today
