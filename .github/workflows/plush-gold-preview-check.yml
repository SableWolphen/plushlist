name: Plush Gold preview validation
on:
  push:
    branches:
      - plush-gold-preview
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: plush-gold-preview
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/setup-plush-gold-preview.js
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Remove temporary setup files
        run: |
          rm scripts/setup-plush-gold-preview.js
          rm .github/workflows/plush-gold-preview-check.yml
      - name: Commit validated Gold preview setup
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add src/components/organized-settings.jsx src/components/habit-background-engine.jsx scripts/test-product-quality.js scripts/setup-plush-gold-preview.js .github/workflows/plush-gold-preview-check.yml
          git commit -m "Finish Plush Gold free-preview setup"
          git push origin plush-gold-preview
