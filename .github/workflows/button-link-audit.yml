name: Button and link audit
on:
  push:
    branches:
      - button-link-audit
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: button-link-audit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/finalize-button-link-audit.js
      - run: npm ci
      - run: node scripts/audit-interactive-wiring.js
      - run: npm test
      - run: npm run web:sync
      - name: Remove temporary validation files
        run: |
          rm scripts/finalize-button-link-audit.js
          rm .github/workflows/button-link-audit.yml
      - name: Commit validated wiring audit
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add oauth.html package.json scripts/audit-interactive-wiring.js scripts/validate-app-source.js scripts/finalize-button-link-audit.js .github/workflows/button-link-audit.yml
          git commit -m "Audit and protect interactive wiring"
          git push origin button-link-audit
