name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site (same esbuild pipeline as Android/Cloudflare)
        run: npm run web:sync

      - name: Verify shared build stamp
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('www/build-info.json','utf8'));if(x.gitSha!==process.env.GITHUB_SHA){console.error(x);process.exit(1)};console.log('Verified shared build',x.gitSha)"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
