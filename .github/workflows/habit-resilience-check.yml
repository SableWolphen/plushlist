name: Habit resilience validation

on:
  push:
    branches:
      - habit-resilience-suite

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Verify resilience features
        run: |
          grep -q 'WHY DIDN' src/components/habit-resilience.jsx
          grep -q '3-DAY RESTART RAMP' src/components/habit-resilience.jsx
          grep -q 'PLAN TOMORROW IN 20 SECONDS' src/components/habit-resilience.jsx
          grep -q 'BAD-DAY BUTTON' src/components/habit-resilience.jsx
          grep -q 'GUARDIAN ENCOURAGEMENT' src/components/habit-resilience.jsx
          grep -q 'offline care' src/components/habit-resilience.jsx
          grep -q 'MY INSTRUCTION MANUAL' src/components/habit-resilience.jsx
          grep -q 'WEEKLY RESET' src/components/habit-resilience.jsx
          grep -q 'HabitResilienceSuite' src/components/today-panel.jsx
          grep -q 'ResilienceProgress' src/components/progress-panel.jsx
