name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for credential in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!credential}" ]; then
              echo "::error::Missing $credential. Configure it in repository Settings > Secrets and variables > Actions."
              echo "- Missing $credential" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Cloudflare publishing is blocked; no deployment has occurred." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app tests
        run: npm test

      - name: Build the exact shared www artifact
        run: npm run web:sync

      - name: Verify build stamp
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('www/build-info.json','utf8'));if(x.gitSha!==process.env.GITHUB_SHA){console.error(x);process.exit(1)};console.log('Verified shared build',x.gitSha)"

      - name: Deploy exact www artifact to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Cloudflare commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            LIVE_SHA="$(curl --fail --silent --show-error --no-cache "https://plushlife.plushlife-app.workers.dev/build-info.json?verify=${EXPECTED_SHA}-${attempt}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).gitSha||'')}catch(e){process.exit(2)}})")" || true
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare is serving the expected PlushLife build: $LIVE_SHA"
              exit 0
            fi
            echo "Attempt $attempt: live build is '$LIVE_SHA', waiting for propagation..."
            sleep 10
          done
          echo "Cloudflare did not serve the expected commit after deployment." >&2
          exit 1
