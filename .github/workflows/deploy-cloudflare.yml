name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app tests
        run: npm test

      - name: Build the exact shared www artifact
        run: npm run web:sync

      - name: Verify build stamp
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('www/build-info.json','utf8'));if(x.gitSha!==process.env.GITHUB_SHA){console.error(x);process.exit(1)};console.log('Verified shared build',x.gitSha)"

      - name: Explain missing Cloudflare credentials
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: |
          echo "::warning::Cloudflare deploy is ready, but CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both configured as GitHub Actions secrets. The build is valid; deployment was skipped."

      - name: Deploy exact www artifact to Cloudflare
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Cloudflare commit
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            LIVE_SHA="$(curl --fail --silent --show-error --no-cache "https://plushlife.plushlife-app.workers.dev/build-info.json?verify=${EXPECTED_SHA}-${attempt}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).gitSha||'')}catch(e){process.exit(2)}})")" || true
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare is serving the expected PlushLife build: $LIVE_SHA"
              exit 0
            fi
            echo "Attempt $attempt: live build is '$LIVE_SHA', waiting for propagation..."
            sleep 10
          done
          echo "Cloudflare did not serve the expected commit after deployment." >&2
          exit 1
