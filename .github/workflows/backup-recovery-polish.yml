name: Backup recovery polish validation
on:
  push:
    branches:
      - backup-recovery-polish
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: backup-recovery-polish
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-backup-recovery-polish.js
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Remove temporary validation files
        run: |
          rm scripts/apply-backup-recovery-polish.js
          rm .github/workflows/backup-recovery-polish.yml
      - name: Commit validated recovery polish
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add src/app-source.jsx src/components/organized-settings.jsx src/components/compact-anchor.jsx src/components/today-panel-core.jsx src/device-backup.js scripts/test-backup-recovery.js scripts/test-product-quality.js package.json scripts/apply-backup-recovery-polish.js .github/workflows/backup-recovery-polish.yml
          git commit -m "Harden backup recovery and compact mobile controls"
          git push origin backup-recovery-polish
