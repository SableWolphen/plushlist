name: Task cross-off validation

on:
  push:
    branches:
      - fix-task-cross-off

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Verify completed tasks stay visible
        run: |
          grep -q 'visibleCompletedKeys' src/components/today-panel.jsx
          grep -q 'TUCKED IN TODAY' src/components/baby-today.jsx
          grep -q 'textDecoration: "line-through"' src/components/baby-today.jsx
