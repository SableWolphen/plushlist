name: Companion declutter validation

on:
  push:
    branches:
      - declutter-daily-companion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Verify companion wrapper
        run: |
          test -f src/components/daily-companion-core.jsx
          grep -q 'DailyCompanionCore' src/components/daily-companion.jsx
          grep -q 'Optional tools stay tucked away' src/components/daily-companion.jsx
