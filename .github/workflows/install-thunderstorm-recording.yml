name: Install uploaded Thunderstorm recording

on:
  workflow_dispatch: {}
  push:
    branches: [audio/thunderstorm-upload]

permissions:
  contents: write

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[install-thunderstorm-recording]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: audio/thunderstorm-upload
          fetch-depth: 0

      - name: Download the exact Mixkit sound from the uploaded file name
        run: |
          curl --fail --location --retry 3 \
            'https://assets.mixkit.co/active_storage/sfx/2415/2415-preview.mp3' \
            --output assets/thunderstorm.mp3
          test "$(wc -c < assets/thunderstorm.mp3)" -gt 100000
          file assets/thunderstorm.mp3 | grep -Ei 'audio|mpeg|mp3'

      - name: Replace procedural Thunderstorm with the recording
        run: python3 scripts/install-thunderstorm-audio.py

      - name: Install dependencies
        run: npm ci

      - name: Run all app tests
        run: npm test

      - name: Verify production build contains the recording
        run: |
          npm run web:sync
          test -s www/assets/thunderstorm.mp3
          grep -q 'thunderstorm.mp3' www/assets/gentle-discovery-ui.js

      - name: Commit tested recording and cleanup staging helpers
        run: |
          rm -f scripts/install-thunderstorm-audio.py .github/workflows/install-thunderstorm-recording.yml
          git config user.name 'SableWolphen'
          git config user.email 'johnston.alexander.k@gmail.com'
          git add -A
          git commit -m 'Use uploaded Mixkit recording for Thunderstorm sound'
          git push origin HEAD:audio/thunderstorm-upload
