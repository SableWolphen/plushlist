name: Repair uploaded app source
on:
  push:
    paths:
      - scripts/repair-app-source.patch
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch app source
        run: |
          git show f05bca6a210b77872fa84304cf8751cc15bf9b2d:src/app-source.jsx > src/app-source.jsx
          git apply scripts/repair-app-source.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app-source.jsx
          git commit -m "Repair uploaded app source"
          git push
