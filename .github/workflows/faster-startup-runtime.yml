name: Faster startup runtime validation
on:
  push:
    branches:
      - faster-startup-runtime
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: faster-startup-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-faster-startup.js
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Remove temporary validation files
        run: |
          rm scripts/apply-faster-startup.js
          rm .github/workflows/faster-startup-runtime.yml
      - name: Commit validated performance changes
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add assets/plush-runtime.js src/device-backup.js scripts/test-product-quality.js scripts/apply-faster-startup.js .github/workflows/faster-startup-runtime.yml
          git commit -m "Reduce startup background contention"
          git push origin faster-startup-runtime
