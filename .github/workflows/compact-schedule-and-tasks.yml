name: Compact schedule and task UI validation
on:
  push:
    branches:
      - compact-schedule-and-tasks
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: compact-schedule-and-tasks
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/patch-compact-schedule-and-tasks.js
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Remove temporary validation files
        run: |
          rm scripts/patch-compact-schedule-and-tasks.js
          rm .github/workflows/compact-schedule-and-tasks.yml
      - name: Commit validated compact UI fix
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add src/components/baby-today.jsx src/components/today-panel-core.jsx scripts/audit-interactive-wiring.js scripts/patch-compact-schedule-and-tasks.js .github/workflows/compact-schedule-and-tasks.yml
          git commit -m "Fix schedule expansion and compact Today tasks"
          git push origin compact-schedule-and-tasks
