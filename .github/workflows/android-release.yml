name: Build signed Android App Bundle

# Manual only — this never runs on a push. It builds app-release.aab and
# always uploads it as a workflow artifact for you to download yourself.
#
# It will ALSO publish straight to Google Play if (and only if) the
# PLAY_SERVICE_ACCOUNT_JSON secret is set — see docs/google-play-auto-publish.md
# for how to create that service account. Without the secret, this workflow
# behaves exactly as before: a downloadable .aab and nothing else.
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Android versionCode (positive integer, must increase each release)"
        required: true
        type: string
      versionName:
        description: "Android versionName (e.g. 1.0.0)"
        required: true
        type: string
      track:
        description: "Google Play track to publish to (only used if PLAY_SERVICE_ACCOUNT_JSON is set)"
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_SECRET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run app tests
        run: npm test

      - name: Build www/ and sync Android
        run: npm run android:sync

      - name: Set release version
        working-directory: android/app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ inputs.versionCode }}/" build.gradle
          sed -i 's/versionName "1.0"/versionName "${{ inputs.versionName }}"/' build.gradle

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed AAB
        working-directory: android
        env:
          PLUSHLIFE_KEYSTORE_PATH: release.keystore
          PLUSHLIFE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLUSHLIFE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLUSHLIFE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLUSHLIFE_GIT_SHA: ${{ github.sha }}
        run: ./gradlew bundleRelease

      - name: Validate signed AAB
        run: |
          curl --fail --location --silent --show-error \
            --output bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          java -jar bundletool.jar validate \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab
          test "$(java -jar bundletool.jar dump manifest \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --xpath=/manifest/uses-sdk/@android:targetSdkVersion)" = "36"
          keytool -printcert \
            -jarfile android/app/build/outputs/bundle/release/app-release.aab \
            | grep 'Owner: CN=PlushLife Upload'

      - name: Dump full manifest for diagnostics
        run: |
          java -jar bundletool.jar dump manifest \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab
          echo "--- native libs per module (ABI check) ---"
          unzip -l android/app/build/outputs/bundle/release/app-release.aab | grep -i "\.so$" || echo "(no .so files found)"

      - name: Build universal APK for direct-install testing
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output=app-release.apks \
            --mode=universal \
            --ks=android/app/release.keystore \
            --ks-key-alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass=pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass=pass:"${{ secrets.ANDROID_KEY_PASSWORD }}"
          unzip -o app-release.apks -d app-release-apks
          mv app-release-apks/universal.apk app-release-${{ inputs.versionCode }}.apk

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: SHA-256 of the AAB and APK
        run: |
          sha256sum android/app/build/outputs/bundle/release/app-release.aab
          sha256sum app-release-${{ inputs.versionCode }}.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.versionCode }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.versionCode }}-apk
          path: app-release-${{ inputs.versionCode }}.apk
          retention-days: 30

      - name: Publish to Google Play
        if: env.HAS_PLAY_SECRET == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.PlushLife
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
