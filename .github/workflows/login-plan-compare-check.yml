name: Login plan comparison validation
on:
  push:
    branches:
      - login-free-gold-comparison
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: login-free-gold-comparison
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Remove temporary workflow
        run: rm .github/workflows/login-plan-compare-check.yml
      - name: Commit validated login comparison
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add login.html .github/workflows/login-plan-compare-check.yml
          git commit -m "Finish login Free and Gold comparison"
          git push origin login-free-gold-comparison
