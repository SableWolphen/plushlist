name: Completed task flow validation

on:
  push:
    branches:
      - unify-completed-task-flow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Verify completion flow
        run: |
          grep -q 'COMPLETED_LINGER_MS = 2600' src/components/today-panel.jsx
          grep -q 'recentlyCompletedKeys' src/components/baby-today.jsx
          grep -q 'COMPLETED TODAY' src/components/baby-today.jsx
          grep -q 'Completed today' src/components/low-screen-today.jsx
          grep -q 'TodayPanelCore {...modeProps}' src/components/today-panel.jsx
