name: Companion cloud sync validation

on:
  push:
    branches:
      - sync-companion-state

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Verify account continuity safeguards
        run: |
          test -f src/components/companion-cloud-sync.jsx
          grep -q 'companion_state' src/components/companion-cloud-sync.jsx
          grep -q 'Restoring your companion tools' src/components/daily-companion.jsx
          grep -q 'add column if not exists companion_state jsonb' database/202608120225_add_companion_state.sql
          ! grep -q 'service_role' src/components/companion-cloud-sync.jsx
