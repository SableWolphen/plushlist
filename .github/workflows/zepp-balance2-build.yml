name: Build Zepp Balance 2 app

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'wearables/zepp/**'
      - '.github/workflows/zepp-balance2-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zepp dependencies
        working-directory: wearables/zepp
        run: npm ci

      - name: Build Balance 2 ZAB
        working-directory: wearables/zepp
        run: npm run build

      - name: Find built ZAB
        run: |
          find wearables/zepp -type f -name '*.zab' -print
          test -n "$(find wearables/zepp -type f -name '*.zab' -print -quit)"

      - name: Upload Balance 2 app
        uses: actions/upload-artifact@v4
        with:
          name: plushlife-balance2-zab
          path: wearables/zepp/**/*.zab
          if-no-files-found: error
          retention-days: 30
