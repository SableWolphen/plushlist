name: Watch live sync diagnostic

on:
  push:
    branches: [feature/zepp-live-task-sync]
    paths:
      - '.github/workflows/watch-live-sync-diagnostic.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show progress loading hook
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('index.html','utf8');
          for (const needle of ['setDone({});', 'setSyncStatus("syncing");\n    Promise.all([', 'from("daily_progress")']) {
            console.log(`\n===== ${needle} =====`);
            let from = 0, found = 0;
            while (found < 5) {
              const i = src.indexOf(needle, from);
              if (i < 0) break;
              console.log(src.slice(Math.max(0, i - 1000), Math.min(src.length, i + 3500)));
              console.log('\n---');
              from = i + needle.length;
              found++;
            }
          }
          NODE
