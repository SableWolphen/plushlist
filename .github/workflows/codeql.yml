name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, business-launch-2026]
  schedule:
    - cron: "23 9 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-source:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-android:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        timeout-minutes: 10
        with:
          cmdline-tools-version: "12266719"
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run complete app tests
        run: npm test

      - name: Generate the Capacitor Android project
        run: npm run android:sync

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true

      - name: Build Android sources for analysis
        id: android_build
        working-directory: android
        run: |
          node -e "const fs=require('fs'),p='app/src/main/assets/capacitor.config.json',c=JSON.parse(fs.readFileSync(p));c.loggingBehavior='production';fs.writeFileSync(p,JSON.stringify(c))"
          ./gradlew --no-daemon clean assembleDebug assembleRelease assembleReleaseAndroidTest -PplushlifeSmokeTest

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android API 35 startup and edge-to-edge
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            bash scripts/smoke-android-release.sh
            bash scripts/test-android-edge-to-edge.sh 35

      - name: Verify edge-to-edge on Android API 29
        if: ${{ !cancelled() && steps.android_build.conclusion == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash scripts/test-android-edge-to-edge.sh 29

      - name: Verify edge-to-edge on Android API 36
        if: ${{ !cancelled() && steps.android_build.conclusion == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: bash scripts/test-android-edge-to-edge.sh 36

      - name: Save optimized Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-smoke
          path: android/app/build/outputs/smoke/

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  release-android:
    name: Publish Android after green CodeQL
    needs:
      - analyze-source
      - analyze-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/auto-play-release.yml
    secrets: inherit
