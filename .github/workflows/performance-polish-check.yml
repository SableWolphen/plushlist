name: Performance polish validation

on:
  push:
    branches:
      - performance-polish-2

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-polish-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply root performance patch
        run: |
          node scripts/apply-startup-cache-patch.js
          if ! git diff --quiet -- src/app-source.jsx; then
            git config user.name "SableWolphen"
            git config user.email "johnston.alexander.k@gmail.com"
            git add src/app-source.jsx
            git commit -m "Cache warm starts and memoize habit analytics"
            git push origin HEAD:performance-polish-2
          fi
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Show critical bundle sizes
        run: |
          wc -c www/assets/app.bundle.js
          find www/assets/chunks -type f -printf '%s %p\n' | sort -nr | head -10
