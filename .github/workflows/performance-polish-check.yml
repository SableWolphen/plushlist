name: Performance polish validation

on:
  push:
    branches:
      - performance-polish-runtime

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run web:sync
      - name: Verify performance polish outputs
        run: |
          test -f www/assets/plush-runtime.js
          test -f www/assets/prefetch-manifest.json
          test -s www/assets/prefetch-manifest.json
          grep -q 'plush-runtime.js' www/index.html
          grep -q 'type="module" src="./assets/app.bundle.js"' www/index.html
          grep -q 'plushlife-v65' www/service-worker.js
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("www/assets/prefetch-manifest.json","utf8")); if(!Array.isArray(p)||p.length<2) process.exit(1); console.log("idle prefetch entries:",p.length,p)'
