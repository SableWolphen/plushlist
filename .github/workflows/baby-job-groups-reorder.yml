name: Baby Mode grouped jobs validation
on:
  push:
    branches:
      - baby-job-groups-reorder
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: baby-job-groups-reorder
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/patch-baby-job-groups.js
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Remove temporary validation files
        run: |
          rm scripts/patch-baby-job-groups.js
          rm .github/workflows/baby-job-groups-reorder.yml
      - name: Commit validated Baby Mode reorder fix
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add src/components/baby-today.jsx scripts/audit-interactive-wiring.js scripts/patch-baby-job-groups.js .github/workflows/baby-job-groups-reorder.yml
          git commit -m "Restore grouped and reorderable Baby Mode jobs"
          git push origin baby-job-groups-reorder
