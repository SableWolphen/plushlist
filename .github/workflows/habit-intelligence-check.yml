name: Habit intelligence validation

on:
  push:
    branches:
      - habit-intelligence-suite

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Verify habit intelligence suite
        run: |
          test -f src/components/habit-intelligence.jsx
          grep -q "TODAY'S ANCHOR" src/components/habit-intelligence.jsx
          grep -q "7-day habit experiment" src/components/habit-intelligence.jsx
          grep -q "WEEKLY HABIT REVIEW" src/components/habit-intelligence.jsx
          grep -q "PlushPaths" src/components/habit-intelligence.jsx
          grep -q "HABIT_STATE_KEY" src/components/companion-cloud-sync.jsx
          grep -q "HabitCoach" src/components/today-panel.jsx
          grep -q "WeeklyHabitReview" src/components/progress-panel.jsx
          grep -q "BabyHabitAnchor" src/components/baby-today.jsx
