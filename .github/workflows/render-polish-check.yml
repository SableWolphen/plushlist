name: Render polish validation

on:
  push:
    branches:
      - render-polish-optimization

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run web:sync
      - name: Verify render optimization
        run: |
          grep -q 'React.memo(function PlushMascot' src/components/mascot.jsx
          grep -q 'React.memo(function HabitTypeIcon' src/components/shared.jsx
          grep -q 'prefers-reduced-motion: reduce' src/components/mascot.jsx
          test -f www/assets/app.bundle.js
