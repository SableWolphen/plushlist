name: Gentle life checks
on:
  pull_request:
    paths:
      - 'src/gentle-calendar.mjs'
      - 'src/plush-smart-adaptation.js'
      - 'src/components/gentle-calendar.jsx'
      - 'src/components/plush-knows-me-smart.jsx'
      - 'src/components/schedule-editor-panel.jsx'
      - 'scripts/test-gentle-calendar.mjs'
      - 'scripts/test-adaptive-day.mjs'
      - 'package.json'
      - '.github/workflows/gentle-life-checks.yml'
  workflow_dispatch:
jobs:
  gentle-life:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:gentle-life
      - run: npm run web:sync
