name: Task drag validation

on:
  push:
    branches: [feature/task-group-drag-drop]
    paths:
      - 'index.html'
      - '.github/workflows/task-drag-diagnostic.yml'
      - 'scripts/patch-task-drag-drop.js'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply drag-and-drop patch
        run: node scripts/patch-task-drag-drop.js
      - name: Install dependencies
        run: npm ci
      - name: Run full PlushLife tests
        run: npm test
      - name: Verify drag/drop wiring
        run: |
          grep -q 'data-plushlife-task-drop-section' index.html
          grep -q 'onDragStart' index.html
          grep -q 'onPointerUp' index.html
          grep -q 'moveTaskToSection' index.html
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add drag and drop between task groups'
          git push origin HEAD:feature/task-group-drag-drop
