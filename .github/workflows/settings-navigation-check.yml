name: Settings navigation validation

on:
  push:
    branches:
      - settings-navigation-cleanup

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run web:sync
      - name: Verify organized settings
        run: |
          grep -q 'organized-settings.jsx' src/components/settings-panel.jsx
          grep -q 'Search settings' src/components/organized-settings.jsx
          grep -q 'Notifications & Reminders' src/components/organized-settings.jsx
          grep -q 'Privacy & Data' src/components/organized-settings.jsx
          test -f www/assets/app.bundle.js
          test -d www/assets/chunks
