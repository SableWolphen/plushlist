name: V1 finish validation

on:
  push:
    branches:
      - v1-finish-pass

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-finish-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply finish patch
        run: |
          node scripts/apply-v1-finish-patch.js
          if ! git diff --quiet -- src/components/daily-companion-core.jsx src/components/today-panel-core.jsx src/components/organized-settings.jsx; then
            git config user.name "SableWolphen"
            git config user.email "johnston.alexander.k@gmail.com"
            git add src/components/daily-companion-core.jsx src/components/today-panel-core.jsx src/components/organized-settings.jsx
            git commit -m "Polish restart, reminders, and first-week guidance"
            git push origin HEAD:v1-finish-pass
          fi
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
