name: Apply approved UI cleanup
on:
  push:
    paths:
      - scripts/apply-ui-cleanup.patch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: |
          git apply scripts/apply-ui-cleanup.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/plush-content.js package.json scripts/test-simplified-ui.js src/app-source.jsx src/components/organized-settings.jsx src/components/progress-panel-core.jsx src/components/today-panel-core.jsx src/components/today-panel.jsx
          git commit -m "Simplify primary app experience"
          git push
