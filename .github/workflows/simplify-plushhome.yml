name: Simplify PlushHome validation
on:
  push:
    branches:
      - simplify-plushhome
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: simplify-plushhome
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/patch-simplify-home-v2.js
      - run: npm ci
      - run: npm test
      - run: npm run web:sync
      - name: Commit validated Home simplification
        run: |
          rm scripts/fix-patch-simplify-home.js
          rm scripts/patch-simplify-home.js
          rm scripts/patch-simplify-home-v2.js
          rm .github/workflows/simplify-plushhome.yml
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add -A
          git commit -m "Simplify PlushHome around today's essentials"
          git push origin simplify-plushhome
